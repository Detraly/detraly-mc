plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

// Jar: Detraly-NeoForge-<mod_version>-mc<minecraft_version>.jar
version = "${project.mod_version}-mc${project.minecraft_version}"
base.archivesName = project.archives_base_name

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

neoForge {
    version = project.neo_version
}

// The SDK sources are compiled straight into this module, exactly like the Fabric module does.
sourceSets {
    main {
        java {
            srcDir '../sdk/src/main/java'
        }
    }
}

dependencies {
    implementation 'org.json:json:20210307'
    jarJar(implementation('org.json:json')) {
        version { strictly '[20210307,)'; prefer '20210307' }
    }
    compileOnly 'org.apache.logging.log4j:log4j-core:2.22.1'
}

processResources {
    def modVersion = project.mod_version
    inputs.property 'version', modVersion
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
